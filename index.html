<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SimulateX — Interactive Academic Simulations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f6f8fc; --surface-3:#eef2f9;
  --border:#e4e8f0; --border-strong:#d6dce8;
  --text:#16203a; --text-muted:#647089; --text-soft:#8b95a9;
  --primary:#3050e8; --primary-hover:#2742c9; --primary-soft:#e8edff;
  --violet:#7c3aed; --violet-soft:#f1ecff;
  --header:linear-gradient(105deg,#0a1733 0%,#13265a 55%,#1b3a7d 100%);
  --canvas:#161b26; --canvas-2:#10141d;
  --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.06);
  --shadow-lg:0 12px 40px rgba(20,30,60,.14);
  --phys:#3b6fe0; --chem:#a855f7; --math:#f59e0b; --bio:#22c55e;
  --ok:#16a34a; --warn:#d97706; --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#131c2e; --surface-2:#0f1726; --surface-3:#1a2538;
  --border:#243049; --border-strong:#2e3c58;
  --text:#e7ecf5; --text-muted:#94a1ba; --text-soft:#6e7c97;
  --primary:#4c6bff; --primary-hover:#5e7bff; --primary-soft:#1b2748;
  --violet:#a78bfa; --violet-soft:#211b3d;
  --header:linear-gradient(105deg,#05091a 0%,#0a1838 55%,#10245a 100%);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; transition:background .35s ease,color .35s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::selection{background:rgba(48,80,232,.22)}
a{color:var(--primary)}
.icon{display:inline-flex;width:1em;height:1em;flex:none}
.icon svg{width:100%;height:100%}

/* ============ APP SHELL ============ */
#app{min-height:100%;display:flex;flex-direction:column}

/* Header */
.hdr{
  background:var(--header); color:#fff; height:66px; flex:none;
  display:flex; align-items:center; gap:24px; padding:0 22px;
  box-shadow:0 4px 20px rgba(8,16,40,.25); position:relative; z-index:60;
}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(150deg,#ffffff22,#ffffff05);border:1px solid #ffffff2a;
  font-size:22px;color:#dfe9ff;
}
.brand .name{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.brand .name b{color:#7aa2ff;font-weight:800}
.tagline{color:#aec2ee;font-size:14px;font-weight:500;letter-spacing:.01em}
.tagline .dot{opacity:.5;margin:0 7px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-btn{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:#ffffff12;border:1px solid #ffffff20;color:#dfe9ff;transition:.2s;
}
.theme-btn:hover{background:#ffffff20}
.usr{
  display:flex;align-items:center;gap:10px;padding:6px 12px 6px 7px;border-radius:30px;
  background:#ffffff12;border:1px solid #ffffff20;transition:.2s;
}
.usr:hover{background:#ffffff20}
.usr .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(150deg,#4f7bff,#2a4fd6);display:grid;place-items:center;font-size:16px;color:#fff}
.usr .who{font-weight:600;font-size:14.5px;color:#fff}
.usr .cv{font-size:11px;color:#bcd0f5}
.menu{
  position:absolute;top:60px;right:22px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);padding:7px;min-width:208px;z-index:80;
}
.menu .mi{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:14.5px;font-weight:500;color:var(--text);width:100%;text-align:left}
.menu .mi:hover{background:var(--surface-3)}
.menu .mi .icon{font-size:17px;color:var(--text-muted)}
.menu .mi.on{color:var(--primary)}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}
.menu .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);padding:9px 12px 5px;font-weight:700}

/* ============ STUDENT LAYOUT ============ */
.stu{flex:1;display:grid;grid-template-columns:var(--sb,308px) 1fr;min-height:0;transition:grid-template-columns .32s cubic-bezier(.4,0,.2,1)}
.stu.collapsed{--sb:62px}

/* Sidebar */
.sb{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sb-head{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;flex:none}
.sb-head .ic{width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:18px;flex:none}
.sb-head h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700;white-space:nowrap}
.sb-collapse{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-muted);font-size:16px}
.sb-collapse:hover{background:var(--surface-3);color:var(--text)}
.sb-body{padding:4px 18px 18px;overflow-y:auto;flex:1}
.fld{margin-bottom:15px}
.fld>label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:7px}
.sel{position:relative}
.sel select{
  width:100%;appearance:none;font-family:inherit;font-size:14.5px;font-weight:500;color:var(--text);
  background:var(--surface);border:1.5px solid var(--border-strong);border-radius:11px;
  padding:12px 38px 12px 40px;cursor:pointer;transition:.18s;
}
.sel select:hover{border-color:#b9c4d8}
.sel select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.sel .lic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.sel .cv{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--text-soft);pointer-events:none}
.btn-primary{
  width:100%;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--primary);color:#fff;font-weight:600;font-size:15.5px;padding:14px;border-radius:12px;
  box-shadow:0 6px 16px rgba(48,80,232,.32);transition:.18s;
}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 8px 22px rgba(48,80,232,.4)}
.btn-primary:active{transform:translateY(0)}
.howto{margin-top:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:15px 16px}
.howto .ht-t{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--primary);font-size:14.5px;margin-bottom:11px}
.howto ol{margin:0;padding-left:18px;color:var(--text-muted);font-size:13.5px;line-height:1.55}
.howto li{margin-bottom:7px}

/* collapsed rail */
.sb.rail .sb-body,.sb.rail .sb-head h2,.sb.rail .sb-head .ic{display:none}
.sb.rail .sb-head{justify-content:center;padding:16px 0}
.sb.rail .sb-collapse{margin:0}

/* Content */
.content{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.subjects{display:flex;align-items:stretch;gap:12px;padding:18px 22px 6px;flex-wrap:wrap}
.subtab{
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:12px 8px 9px;min-width:92px;display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:.18s;position:relative;
}
.subtab:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.subtab .si{font-size:26px;line-height:1;height:30px;display:grid;place-items:center}
.subtab .sn{font-size:13.5px;font-weight:600;color:var(--text-muted)}
.subtab.on{border-color:transparent;background:var(--primary-soft);box-shadow:0 6px 16px rgba(48,80,232,.18)}
.subtab.on .sn{color:var(--primary);font-weight:700}
.subtab.on::after{content:"";position:absolute;bottom:-1px;left:24%;right:24%;height:3px;border-radius:3px;background:var(--primary)}
.info-card{
  margin-left:auto;align-self:center;display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:13px 18px;
}
.info-card .star{font-size:22px;color:var(--math)}
.info-card .t1{font-size:13px;color:var(--text-muted);font-weight:500}
.info-card .t2{font-size:15px;color:var(--primary);font-weight:700}

.divider{height:1px;background:var(--border);margin:8px 22px 0}

/* Main panel */
.panel{margin:18px 22px 8px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.panel-head{display:flex;align-items:center;gap:14px;padding:18px 22px}
.panel-head h1{margin:0;font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-.01em}
.panel-head .tools{margin-left:auto;display:flex;gap:8px}
.tool-btn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:var(--text-muted);border:1px solid var(--border);background:var(--surface)}
.tool-btn:hover{background:var(--surface-3);color:var(--text)}

/* Simulation stage */
.stage{margin:0 16px 16px;background:var(--canvas);border-radius:16px;position:relative;overflow:hidden;border:1px solid #ffffff10}
.stage.builtin{aspect-ratio:1000/560}
.stage svg{display:block;width:100%;height:100%}
.stage iframe{display:block;width:100%;border:none;background:#fff;min-height:520px}
.empty{display:grid;place-items:center;aspect-ratio:1000/520;color:#9aa6bf;text-align:center;padding:30px}
.empty .ic{font-size:46px;opacity:.5;margin-bottom:14px}
.empty h3{margin:0 0 6px;font-family:var(--font-display);font-size:19px;color:#cdd6e8}
.empty p{margin:0;font-size:14px;max-width:340px;line-height:1.5}

/* sim controls overlay */
.sim-ctrl{
  position:absolute;top:14px;right:14px;width:255px;background:rgba(20,26,40,.82);
  backdrop-filter:blur(10px);border:1px solid #ffffff1f;border-radius:14px;padding:16px;color:#e8edf7;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.sim-ctrl h4{margin:0 0 14px;font-family:var(--font-display);font-size:16px;font-weight:700;color:#fff}
.sim-ctrl .row{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:#c7d0e2;margin-bottom:7px}
.sim-ctrl .val{color:#fff;font-weight:700}
.rng{width:100%;-webkit-appearance:none;height:5px;border-radius:5px;background:#3a455c;outline:none;margin:2px 0 14px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 0 0 4px rgba(48,80,232,.25)}
.rng::-moz-range-thumb{width:17px;height:17px;border:none;border-radius:50%;background:var(--primary);cursor:pointer}
.colorpick{position:relative}
.swatch{width:60px;height:30px;border-radius:8px;border:2px solid #ffffff40;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;padding-right:4px}
.swatch .cv{color:#0008;font-size:13px}
.pop{position:absolute;right:0;top:36px;background:#1b2233;border:1px solid #ffffff22;border-radius:11px;padding:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.pop .sw{width:30px;height:30px;border-radius:7px;cursor:pointer;border:2px solid transparent}
.pop .sw:hover{border-color:#fff}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#d4dcec;padding:5px 0;cursor:pointer}
.chk input{appearance:none;width:18px;height:18px;border-radius:5px;border:2px solid #5a6685;flex:none;position:relative;cursor:pointer;transition:.15s}
.chk input:checked{background:var(--primary);border-color:var(--primary)}
.chk input:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:800}
.sim-reset{margin-top:13px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#2a3346;border:1px solid #ffffff1a;color:#dfe6f3;font-weight:600;padding:11px;border-radius:10px;font-size:14px}
.sim-reset:hover{background:#33405a}

/* About */
.about{margin:0 22px 22px;background:var(--violet-soft);border:1px solid color-mix(in srgb,var(--violet) 22%,transparent);border-radius:16px;padding:18px 20px;display:flex;gap:15px}
.about .ai{width:42px;height:42px;border-radius:12px;background:var(--violet);color:#fff;display:grid;place-items:center;font-size:21px;flex:none}
.about h3{margin:0 0 5px;font-family:var(--font-display);font-size:16.5px;font-weight:700;color:var(--violet)}
.about p{margin:0;font-size:14.5px;line-height:1.55;color:var(--text-muted)}

/* ============ ADMIN ============ */
.adm{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto;background:var(--bg)}
.adm-wrap{width:100%;max-width:1120px;margin:0 auto;padding:24px 24px 50px}
.adm-bar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.adm-bar h1{margin:0;font-family:var(--font-display);font-size:25px;font-weight:800;letter-spacing:-.01em}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--violet-soft);color:var(--violet)}
.adm-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);padding:5px;border-radius:13px;margin-left:auto}
.adm-tabs .tb{padding:9px 18px;border-radius:9px;font-weight:600;font-size:14px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
.adm-tabs .tb.on{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(48,80,232,.3)}
.adm-tabs .tb:not(.on):hover{background:var(--surface-3);color:var(--text)}

/* login */
.login{flex:1;display:grid;place-items:center;padding:30px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);padding:34px 32px}
.login-card .lic{width:56px;height:56px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:27px;margin:0 auto 18px}
.login-card h2{margin:0 0 5px;text-align:center;font-family:var(--font-display);font-size:22px;font-weight:800}
.login-card p{margin:0 0 24px;text-align:center;color:var(--text-muted);font-size:14px}
.inp{width:100%;font-family:inherit;font-size:14.5px;color:var(--text);background:var(--surface);border:1.5px solid var(--border-strong);border-radius:11px;padding:12px 14px;transition:.18s}
.inp:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.inp::placeholder{color:var(--text-soft)}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:7px}
.hint{font-size:12.5px;color:var(--text-soft);text-align:center;margin-top:16px}

/* catalogue */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search .icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-soft);font-size:16px}
.search input{width:100%;padding-left:40px}
.fsel{min-width:130px}
.fsel select{width:100%;appearance:none;font-family:inherit;font-size:14px;font-weight:500;color:var(--text);background:var(--surface);border:1.5px solid var(--border-strong);border-radius:11px;padding:11px 32px 11px 13px;cursor:pointer}
.fsel{position:relative}
.fsel .cv{position:absolute;right:11px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-soft);font-size:14px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card .thumb{height:128px;background:linear-gradient(135deg,#1e2a47,#2a3f6e);position:relative;display:grid;place-items:center;font-size:38px;color:#ffffff55}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px)}
.badge.live{background:rgba(22,163,74,.92);color:#fff}
.badge.draft{background:rgba(217,119,6,.92);color:#fff}
.card .cbody{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.card .ctitle{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0 0 8px}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--surface-3);color:var(--text-muted)}
.card .cdesc{font-size:13px;color:var(--text-muted);line-height:1.5;margin:0 0 14px;flex:1}
.card .cact{display:flex;gap:7px;border-top:1px solid var(--border);padding-top:12px}
.mini{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;padding:9px;border-radius:9px;background:var(--surface-3);color:var(--text-muted);transition:.15s}
.mini:hover{background:var(--primary-soft);color:var(--primary)}
.mini.danger:hover{background:#fee2e2;color:#dc2626}
html[data-theme="dark"] .mini.danger:hover{background:#3a1d22}
.mini.go{background:var(--primary);color:#fff}
.mini.go:hover{background:var(--primary-hover);color:#fff}

/* add/edit form */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:26px 28px;max-width:880px}
.form-card h2{margin:0 0 4px;font-family:var(--font-display);font-size:20px;font-weight:700}
.form-card .sub{margin:0 0 22px;color:var(--text-muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.uploader{border:2px dashed var(--border-strong);border-radius:14px;padding:26px;text-align:center;transition:.18s;cursor:pointer;background:var(--surface-2)}
.uploader:hover{border-color:var(--primary);background:var(--primary-soft)}
.uploader .ic{font-size:34px;color:var(--primary);margin-bottom:10px}
.uploader .u1{font-weight:600;font-size:15px;margin-bottom:4px}
.uploader .u2{font-size:13px;color:var(--text-muted)}
.uploader.has{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.seg{display:flex;gap:6px;background:var(--surface-3);padding:5px;border-radius:11px}
.seg button{flex:1;padding:9px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-muted)}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
.form-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:12px;font-weight:600;font-size:14.5px;transition:.18s}
.btn.solid{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(48,80,232,.3)}
.btn.solid:hover{background:var(--primary-hover)}
.btn.ghost{background:var(--surface-3);color:var(--text)}
.btn.ghost:hover{background:var(--border)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ok:hover{filter:brightness(1.06)}
.preview-box{margin-top:18px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--canvas)}
.preview-box .pv-head{display:flex;align-items:center;gap:8px;padding:11px 15px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:13.5px;font-weight:600;color:var(--text-muted)}
.preview-box .dot{width:9px;height:9px;border-radius:50%;background:#ff5f57}
.preview-box .dot.y{background:#febc2e}.preview-box .dot.g{background:#28c840}
.preview-box iframe{width:100%;height:440px;border:none;background:#fff}
.preview-box .pv-empty{height:240px;display:grid;place-items:center;color:#8a96ae;font-size:14px}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:13px 22px;border-radius:30px;font-weight:600;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:.3s;z-index:200;display:flex;align-items:center;gap:9px;pointer-events:none}

.empty-cat{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-cat .ic{font-size:46px;opacity:.4;margin-bottom:12px}

/* ============ RESPONSIVE ============ */
@media(max-width:1080px){
  .sim-ctrl{position:static;width:auto;margin:14px;backdrop-filter:none;background:rgba(20,26,40,.95)}
  .stage.builtin{aspect-ratio:auto}
  .stage.builtin svg{aspect-ratio:1000/560}
}
@media(max-width:860px){
  .tagline{display:none}
  .stu{grid-template-columns:1fr}
  .sb{position:fixed;top:66px;left:0;bottom:0;width:300px;z-index:50;transform:translateX(-100%);transition:transform .3s;box-shadow:var(--shadow-lg)}
  .stu:not(.collapsed) .sb{transform:translateX(0)}
  .stu.collapsed .sb{transform:translateX(-100%)}
  .scrim{position:fixed;inset:66px 0 0;background:rgba(8,14,30,.5);z-index:45;opacity:0;pointer-events:none;transition:.3s}
  .stu:not(.collapsed) .scrim{opacity:1;pointer-events:auto}
  .grid2{grid-template-columns:1fr}
  .mobile-toggle{display:grid!important}
  .info-card{display:none}
}
.mobile-toggle{display:none;width:40px;height:40px;border-radius:11px;place-items:center;font-size:20px;background:#ffffff12;border:1px solid #ffffff20;color:#fff}
@media(max-width:520px){
  .brand .name{font-size:20px}.hdr{gap:12px;padding:0 14px}
  .panel,.about{margin-left:12px;margin-right:12px}
  .subjects{padding:14px 14px 6px}
  .usr .who,.usr .cv{display:none}.usr{padding:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function simSrcDoc(s){

   return base.replace('location.search','"?t='+encodeURIComponent(s.title)+'&d='+encodeURIComponent(s.desc)+'&e='+encodeURIComponent(s.emoji||'\uD83D\uDD2C')+'"');

/* ---- the built-in interactive Reflection of Light SVG ---- */
function reflectionSVG(){
 var sm=state.sim, a=sm.angle, t=a*Math.PI/180;
 var P={x:500,y:470}, L=362, R=95;
 var src={x:P.x-L*Math.sin(t), y:P.y-L*Math.cos(t)};
 var refl={x:P.x+L*Math.sin(t), y:P.y-L*Math.cos(t)};
 var col=sm.color;
 // arcs (sampled to avoid sweep-flag guesswork)
 function arc(side){var p='';for(var i=0;i<=24;i++){var f=(a*i/24)*Math.PI/180;var dx=Math.sin(f)*side,dy=Math.cos(f);p+=(i?'L':'M')+(P.x+R*dx).toFixed(1)+' '+(P.y-R*dy).toFixed(1)+' ';}return p;}
 var liX=P.x-(R+22)*Math.sin(t/2),liY=P.y-(R+22)*Math.cos(t/2);
 var lrX=P.x+(R+22)*Math.sin(t/2),lrY=P.y-(R+22)*Math.cos(t/2);
 // arrowheads
 function head(at,from,color){var dx=at.x-from.x,dy=at.y-from.y,l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;var sz=15;
  var bx=at.x-dx*sz,by=at.y-dy*sz,px=-dy,py=dx;
  return '<polygon points="'+at.x.toFixed(1)+','+at.y.toFixed(1)+' '+(bx+px*7).toFixed(1)+','+(by+py*7).toFixed(1)+' '+(bx-px*7).toFixed(1)+','+(by-py*7).toFixed(1)+'" fill="'+color+'"/>';}
 // protractor
 var prot='';
 if(sm.protractor){var PR=168,ticks='';for(var d=0;d<=180;d+=10){var ang=(d-90)*Math.PI/180;var x1=P.x+PR*Math.sin(ang),y1=P.y-PR*Math.cos(ang);var inr=(d%30===0)?PR-18:PR-9;var x2=P.x+inr*Math.sin(ang),y2=P.y-inr*Math.cos(ang);ticks+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#7d8aa6" stroke-width="'+(d%30===0?2:1)+'"/>';}
  var ap='';for(var i=0;i<=60;i++){var an=(-90+180*i/60)*Math.PI/180;ap+=(i?'L':'M')+(P.x+PR*Math.sin(an)).toFixed(1)+' '+(P.y-PR*Math.cos(an)).toFixed(1)+' ';}
  prot='<path d="'+ap+'" fill="none" stroke="#5d6a86" stroke-width="1.5"/>'+ticks;}
 // flashlight transform: point from src toward P
 var fdeg=Math.atan2(P.y-src.y,P.x-src.x)*180/Math.PI;
 var torch='<g transform="translate('+src.x.toFixed(1)+','+src.y.toFixed(1)+') rotate('+fdeg.toFixed(1)+')">'
  +'<rect x="-78" y="-15" width="56" height="30" rx="8" fill="#2c333f"/>'
  +'<rect x="-78" y="-15" width="56" height="30" rx="8" fill="url(#torchG)"/>'
  +'<rect x="-24" y="-19" width="20" height="38" rx="5" fill="#3a4250"/>'
  +'<path d="M-4 -19 L14 -12 L14 12 L-4 19 Z" fill="#1f2530"/>'
  +'<ellipse cx="13" cy="0" rx="5" ry="13" fill="#cfe0ff" opacity="0.9"/>'
  +'<circle cx="-50" cy="0" r="5" fill="#1b212b"/></g>';

 var glow=function(x1,y1,x2,y2,w,o){return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+'" stroke-width="'+w+'" stroke-linecap="round" opacity="'+o+'" filter="url(#blur)"/>';};
 var core=function(x1,y1,x2,y2){return '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round"/>';};

 var svg='<svg viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" id="reflsvg">'
 +'<defs>'
 +'<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>'
 +'<linearGradient id="mirror" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf4"/><stop offset="0.45" stop-color="#aeb7c6"/><stop offset="0.55" stop-color="#8b94a6"/><stop offset="1" stop-color="#cfd6e1"/></linearGradient>'
 +'<linearGradient id="torchG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4350"/><stop offset="1" stop-color="#20262f"/></linearGradient>'
 +'<radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1c2331"/><stop offset="1" stop-color="#10141d"/></radialGradient>'
 +'</defs>'
 +'<rect width="1000" height="560" fill="url(#bg)"/>'
 + prot
 + (sm.normal?'<line x1="500" y1="120" x2="500" y2="470" stroke="#9aa6bf" stroke-width="2" stroke-dasharray="8 7"/><text x="510" y="135" fill="#aeb8cd" font-size="20" font-family="Inter,sans-serif">Normal</text>':'')
 + (sm.angles?'<path d="'+arc(-1)+'" fill="none" stroke="#cfd7e8" stroke-width="1.6"/><path d="'+arc(1)+'" fill="none" stroke="#cfd7e8" stroke-width="1.6"/>'
     +'<text x="'+liX.toFixed(1)+'" y="'+liY.toFixed(1)+'" fill="#e6ebf5" font-size="22" font-family="Inter" text-anchor="middle" dominant-baseline="middle">\u2220i</text>'
     +'<text x="'+lrX.toFixed(1)+'" y="'+lrY.toFixed(1)+'" fill="#e6ebf5" font-size="22" font-family="Inter" text-anchor="middle" dominant-baseline="middle">\u2220r</text>':'')
 + (sm.incident?glow(src.x,src.y,P.x,P.y,9,0.55)+core(src.x,src.y,P.x,P.y)+head(P,src,col):'')
 + (sm.reflected?glow(P.x,P.y,refl.x,refl.y,9,0.55)+core(P.x,P.y,refl.x,refl.y)+head(refl,P,col):'')
 +'<rect x="120" y="470" width="760" height="15" rx="2" fill="url(#mirror)"/>'
 +'<rect x="120" y="485" width="760" height="6" fill="#4a5468"/>'
 +'<g opacity="0.5">';
 for(var hx=130;hx<880;hx+=22){svg+='<line x1="'+hx+'" y1="491" x2="'+(hx-10)+'" y2="501" stroke="#39435a" stroke-width="2"/>';}
 svg+='</g>';
 if(sm.incident)svg+=torch;
 svg+='</svg>';
 return svg;
}

   render();break;}

  case 'demo-login':{state.authed=true;state.isAdmin=true;state.adminView='catalogue';render();toast('Signed in (demo)');break;}
  case 'admin-logout':{if(window.FB&&window.FB.enabled){window.FB.signOutUser();}state.authed=false;state.user=null;state.isAdmin=false;state.menuOpen=false;render();break;}
  case 'admin-nav':{var v=el.getAttribute('data-view');state.adminView=v;if(v==='add'){state.editId=null;state.form=blankForm();}render();break;}
  case 'admin-edit':{var s=findSim(el.getAttribute('data-id'));if(!s)break;state.editId=s.id;state.adminView='edit';state.form=Object.assign(blankForm(),s,{previewSim:null});render();break;}
  case 'admin-toggle':{var s2=findSim(el.getAttribute('data-id'));if(s2&&!s2.builtin){var ns=s2.status==='live'?'draft':'live';if(FB_MODE){window.FB.toggleSim(s2.id,ns).then(function(){toast(s2.title+(ns==='live'?' published':' unpublished'));}).catch(function(e){toast('Failed: '+(e&&e.code||e));});}else{s2.status=ns;saveCat();render();toast(s2.title+(ns==='live'?' published':' unpublished'));}}break;}
  case 'admin-delete':{var id=el.getAttribute('data-id');var s3=findSim(id);if(s3&&!s3.builtin&&confirm('Archive \u201C'+s3.title+'\u201D? This removes it from the catalogue.')){if(FB_MODE){window.FB.deleteSim(id).then(function(){if(state.openId===id)state.openId=null;toast('Simulation archived');}).catch(function(e){toast('Failed: '+(e&&e.code||e));});}else{catalogue=catalogue.filter(function(x){return x.id!==id;});if(state.openId===id)state.openId=null;saveCat();render();toast('Simulation archived');}}break;}

 }

  };fr2.readAsDataURL(e.target.files[0]);
 }
});

window.FB = { enabled: configured };

    const q = isAdmin ? collection(db, "sims") : query(collection(db, "sims"), where("status", "==", "live"));

      status: rec.status, thumb, html: rec.html || "", emoji: rec.emoji || "",
      updatedAtMs: Date.now(), updatedAt: serverTimestamp()
    };
    if (editId) {
      await updateDoc(doc(db, "sims", editId), data);
    } else {
      data.createdAtMs = Date.now();
      data.createdAt = serverTimestamp();
      await setDoc(doc(db, "sims", id), data);
    }
  };
  window.FB.toggleSim = (id, status) => updateDoc(doc(db, "sims", id), { status, updatedAtMs: Date.now() });
  window.FB.deleteSim = (id) => deleteDoc(doc(db, "sims", id));
}
</script>
</body>
